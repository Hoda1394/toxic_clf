[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "toxic-classifier"
version = "0.1.0"
description = "Custom Transformer-based toxic comment classifier"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]

dependencies = [
    "torch>=1.9.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scikit-learn>=0.24.0",
    "tqdm>=4.62.0",
    "tensorboard>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0",
    "flake8>=3.9.0",
]

[project.scripts]
toxic-train = "scripts.train:main"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
